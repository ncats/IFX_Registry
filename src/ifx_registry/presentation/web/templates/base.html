<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IFX Data Registry{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/registry.css') }}">
    <script defer src="{{ url_for('static', path='/registry.js') }}"></script>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/" aria-label="IFX Data Registry home">
        <span class="brand-mark">IFX</span>
        <span>Data Registry</span>
    </a>
    <nav class="primary-nav" aria-label="Primary navigation">
        <a href="/" {% if active_page == "catalog" %}aria-current="page"{% endif %}>Datasets</a>
    </nav>
</header>
<main class="page-shell">
    {% block content %}{% endblock %}
</main>
</body>
</html>
