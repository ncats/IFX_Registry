
services:
  registry:
    build:
      context: .
    image: ifx-registry:local
    init: true
    restart: unless-stopped
    ports:
      - "${IFX_REGISTRY_WEB_PORT:-8049}:8000"
    environment:
      - IFX_REGISTRY_STATE_DIR=/var/lib/ifx-registry
      - IFX_REGISTRY_BUCKET=${IFX_REGISTRY_BUCKET:-aws-ifx-registry}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - IFX_REGISTRY_AWS_ROLE_ARN
      - IFX_REGISTRY_AWS_EXTERNAL_ID
      - IFX_REGISTRY_VERSION_CHECK_TTL_SECONDS=${IFX_REGISTRY_VERSION_CHECK_TTL_SECONDS:-604800}
      - IFX_REGISTRY_DISPLAY_TIMEZONE=${IFX_REGISTRY_DISPLAY_TIMEZONE:-America/New_York}
      - IFX_REGISTRY_ROOT_PATH=${IFX_REGISTRY_ROOT_PATH:-}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - IFX_REGISTRY_AWS_CREDENTIALS=/run/secrets/aws_ifx_registry.yaml
      - IFX_REGISTRY_CURE_CREDENTIALS=/run/secrets/cure_id.yaml
    volumes:
      - registry-state:/var/lib/ifx-registry
      - ./secrets/aws_ifx_registry.yaml:/run/secrets/aws_ifx_registry.yaml:ro
      - ./secrets/cure_id.yaml:/run/secrets/cure_id.yaml:ro
    read_only: true
    tmpfs:
      - /tmp

volumes:
  registry-state:
