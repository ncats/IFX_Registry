[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifx-registry"
version = "0.2.0"
description = "Shared source and artifact registry for NCATS IFX projects"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NCATS IFX" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "boto3>=1.43,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
sources = [
    "ijson>=3.2,<4",
    "requests>=2.31,<3",
]
server = [
    "fastapi>=0.115,<1",
    "ijson>=3.2,<4",
    "jinja2>=3.1,<4",
    "pyarrow>=25,<26",
    "python-multipart>=0.0.9,<1",
    "requests>=2.31,<3",
    "uvicorn[standard]>=0.30,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "ijson>=3.2,<4",
    "jinja2>=3.1,<4",
    "pyarrow>=25,<26",
    "mypy>=1.11",
    "python-multipart>=0.0.9,<1",
    "pytest>=8",
    "pytest-cov>=5",
    "requests>=2.31,<3",
    "ruff>=0.6",
    "types-requests>=2.31",
    "types-PyYAML>=6",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
ifx-registry-web = "ifx_registry.presentation.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ifx_registry = [
    "config/*.yaml",
    "py.typed",
    "presentation/web/static/*",
    "presentation/web/templates/*.html",
    "presentation/web/templates/partials/*.html",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ifx_registry"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.exceptions"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ijson"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
